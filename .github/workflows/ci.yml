name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: check formatting
        run: pnpm fmt:check

  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [24, 26]
        include:
          - node: "24.11.0"
            os: ubuntu-latest
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node v${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: test (unit)
        run: pnpm test --project unit

      - name: install chromium through playwright
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: pnpm exec playwright install chromium

      - name: test (browser)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run pnpm test --project browser

  bun:
    name: test-bun (${{ matrix.bun-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.1.x", "1.2.x", "1.3.x", "1.4.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: install source-test dependencies
        run: pnpm install --frozen-lockfile

      - name: setup bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}
          no-cache: true

      - name: run bun source tests
        run: bun test test-bun/

      - name: build and pack npm package
        run: |
          pnpm build
          mkdir -p node_modules/.cache/bun-consumer
          pnpm pack --ignore-scripts --pack-destination node_modules/.cache/bun-consumer

      - name: prepare isolated Bun consumer
        working-directory: node_modules/.cache/bun-consumer
        run: |
          tarball="$(find . -maxdepth 1 -name 'termenv-*.tgz' -print -quit)"
          test -n "$tarball"
          printf '{"private":true,"type":"module","dependencies":{"termenv":"file:%s"}}\n' "$tarball" > package.json
          cp "$GITHUB_WORKSPACE/test-bun/packed-consumer.ts" .

      - name: install packed npm package with Bun
        working-directory: node_modules/.cache/bun-consumer
        run: bun install --ignore-scripts

      - name: test installed npm package
        working-directory: node_modules/.cache/bun-consumer
        run: bun ./packed-consumer.ts
